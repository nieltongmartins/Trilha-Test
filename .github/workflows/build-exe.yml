name: Gerar EXE Portable

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Atualizar pip
        run: python -m pip install --upgrade pip

      - name: Instalar dependências do projeto
        run: |
          if (Test-Path requirements.txt) {
            python -m pip install -r requirements.txt
          }

      - name: Instalar PyInstaller
        run: python -m pip install pyinstaller

      - name: Gerar executável
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name "Trilha de Auditoria" `
            --collect-all selenium `
            --hidden-import selenium.webdriver.edge.options `
            --hidden-import selenium.webdriver.edge.service `
            --hidden-import selenium.webdriver.common.by `
            --hidden-import selenium.webdriver.support.ui `
            --hidden-import selenium.webdriver.support.expected_conditions `
            main.py

      - name: Verificar arquivos gerados
        run: |
          Get-ChildItem -Recurse dist

      - name: Enviar EXE para download
        uses: actions/upload-artifact@v4
        with:
          name: Trilha-de-Auditoria-Portable
          path: "dist/Trilha de Auditoria.exe"
          if-no-files-found: error
